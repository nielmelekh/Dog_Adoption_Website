<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Form</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="adopt.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Adopt <span id="heading-dog-name">...</span></h1>
        </header>

        <section class="dog-preview">
            <img id="dog-image" src="" alt="Dog Image">
            <h2 id="display-dog-name"></h2>
        </section>

        <form id="adoption-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="+1 234 567 8900" required>
            </div>

            <button type="submit" id="submit-btn">Send</button>
        </form>

        <div class="dog-navigation">
            <button id="back-btn">Back</button>
            <button id="index-btn">Home</button>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="adopt.js"></script>
</body>
</html>
